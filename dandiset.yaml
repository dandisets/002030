dateCreated: '2026-10-15T22:03:52.042907+00:00'
description: "Processed one-photon calcium imaging data from dorsal hippocampal CA1
  of 13 adult C57BL/6J mice of both sexes (344-394 days old on the day of recording)
  freely exploring a circular open-field arena (diameter 96 cm) with visual landmarks
  on the walls. Each mouse was recorded on three consecutive days, one session of
  about 12 minutes per day: 39 sessions and 14,533 neuron-sessions in total (26-695
  neurons per session). GCaMP6s was expressed with AAV/DJ-CAG-GCaMP6s and imaged through
  a GRIN lens with a head-mounted Miniscope V4.4, while a top-mounted camera filmed
  the animal.\n\nEach NWB file holds one session: fluorescence traces (dF/F) of the
  components retained after motion correction (NoRMCorre), source extraction (CNMF-E)
  and visual inspection, and 14 behavioural variables on the time base of the imaging
  frames (nominal 30 frames per second): position of the body centre, speed, body
  and head direction, locomotor states (rest, walk, run), freezing, rearing and occupancy
  of the wall, intermediate and central zones of the arena.\n\nRaw miniscope and behaviour
  videos and the spatial footprints of the components are not included. The dataset
  accompanies the DRIADA paper; scripts that reproduce its real-data figures from
  these files are in the DRIADA repository (publications/elife)."
